<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mony-home — Sin conexión</title>
    <style>
      /* Offline fallback: unauthenticated, zero user data, app palette.
         Static file, so dark mode follows prefers-color-scheme only (the
         in-app localStorage toggle can't reach this document). */
      :root {
        --base: #faf7f0;
        --surface: #fffdf8;
        --ink: #1a2530;
        --muted: #4a5a68;
        --line: #e5dfd2;
        --honey: #ffe5a3;
        --on-accent: #1a2530;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --base: #0f1922;
          --surface: #1a2530;
          --ink: #edeae0;
          --muted: #9aa8b5;
          --line: #2a3a48;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--base);
        color: var(--ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 2rem 1.75rem;
        max-width: 22rem;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1.15rem;
        background: var(--honey);
        color: var(--on-accent);
        font-size: 1.75rem;
        font-weight: 700;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--honey);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark" aria-hidden="true">M</span>
      <h1>Sin conexión</h1>
      <p>No pudimos cargar mony-home. Revisá tu conexión a internet e intentá de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
